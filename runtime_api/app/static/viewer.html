<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Nomi 文件查看器</title>
    <link rel="stylesheet" href="/static/viewer.css?v=20260722-file-viewer-v2" />
  </head>
  <body>
    <main class="viewer-shell">
      <header class="viewer-topbar">
        <div class="file-heading">
          <strong id="viewerFilename">文件</strong>
          <span id="viewerStatus" role="status" aria-live="polite">正在加载文件</span>
        </div>
        <div class="topbar-actions">
          <button
            id="downloadViewer"
            class="icon-button"
            type="button"
            aria-label="下载原文件"
            title="下载"
            disabled
          >
            <span aria-hidden="true">↓</span>
          </button>
          <button id="closeViewer" class="icon-button" type="button" aria-label="关闭文件" title="关闭">×</button>
        </div>
      </header>
      <section id="viewerRoot" class="viewer-root" aria-label="文件内容"></section>
      <section id="viewerError" class="viewer-error" hidden>
        <strong>文件暂时无法显示</strong>
        <p id="viewerErrorMessage"></p>
        <button id="retryViewer" type="button">重新尝试</button>
      </section>
    </main>
    <script src="/static/vendor/file-viewer/flyfish-file-viewer-web-full.iife.js"></script>
    <script src="/static/file-viewer-links.js?v=20260722-file-viewer-v2"></script>
    <script src="/static/viewer.js?v=20260722-file-viewer-v2"></script>
  </body>
</html>
